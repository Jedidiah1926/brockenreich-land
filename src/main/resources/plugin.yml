name: BrockenreichLand
version: '${version}'
main: com.brockenreich.landplugin.LandPlugin
api-version: '1.21'
author: hiblessing
description: Brockenreich Land plugin for Paper 1.21.8
softdepend: [WorldEdit]
commands:
  area:
    description: Manage land areas and their entrance/exit permissions.
    usage: /<command> <region|world|list|info|modify> ...
  farm:
    description: Enchant a held farm item so it can be planted with fixed-time growth.
    usage: /<command> <animate|time test [초]|time default>
  guild:
    description: Manage player-run guilds, which can own land.
    usage: /<command> <create|disband|invite|kick|promote|demote|leave|info|list> ...
permissions:
  brockenreichland.area:
    description: Manage land areas
    default: op
  brockenreichland.area.bypass:
    description: Bypass area entrance/exit restrictions
    default: op
  brockenreichland.farm.admin:
    description: Override farm crop growth times for testing
    default: op
