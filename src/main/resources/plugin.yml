name: BrockenreichLand
version: '${version}'
main: com.brockenreich.landplugin.LandPlugin
api-version: '1.21'
author: hiblessing
description: Brockenreich Land plugin for Paper 1.21.8
softdepend: [WorldEdit]
commands:
  area:
    description: Manage land areas and their entrance/exit permissions.
    usage: /<command> <region|world|list|info|modify> ...
  farm:
    description: Enchant a held farm item so it can be planted with fixed-time growth.
    usage: /<command> <animate|time test [초]|time default>
  guild:
    description: Manage player-run guilds, which can own land.
    usage: /<command> <create|disband|invite|kick|promote|demote|leave|info|list> ...
  honor:
    description: Manage equippable honors/titles shown before a player's name in chat.
    usage: /<command> <create|delete|grant|revoke|equip|unequip|mine|list|info> ...
  nickname:
    description: Set a fixed display nickname instead of your Minecraft account name.
    usage: /<command> <새 닉네임|reset [플레이어]>
  money:
    description: Check balances and transfer the server's currency (ȼ).
    usage: /<command> [balance <플레이어>|pay <플레이어> <금액>|give|take|set|top]
permissions:
  brockenreichland.area:
    description: Manage land areas
    default: op
  brockenreichland.area.bypass:
    description: Bypass area entrance/exit restrictions
    default: op
  brockenreichland.farm.admin:
    description: Override farm crop growth times for testing
    default: op
  brockenreichland.honor.admin:
    description: Create/delete honors and grant/revoke them from players
    default: op
  brockenreichland.nickname.admin:
    description: Reset another player's nickname
    default: op
  brockenreichland.economy.admin:
    description: Give/take/set another player's balance
    default: op
